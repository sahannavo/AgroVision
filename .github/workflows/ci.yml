name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  flutter_test:
    name: Flutter Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install App Dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd app
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd app
          flutter test --exclude-tags=emulator

  functions_test:
    name: Cloud Functions Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm install --no-audit --no-fund

      - name: Build and Lint Functions
        run: |
          cd functions
          npm run build
          if [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "eslint is not installed in functions/devDependencies; skipping lint"
          fi

      - name: Run Functions Unit Tests
        run: |
          cd functions
          npm test --if-present
