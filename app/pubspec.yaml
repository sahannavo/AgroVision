name: app
description: "AgroVision - Smart Agricultural Management & Crop Disease Diagnosis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Hardware & Device Features
  camera: ^0.10.6
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.3

  # Charts & Maps
  fl_chart: ^0.68.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities & Local Data
  intl: ^0.19.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

  # Machine Learning & Image Processing
  tflite_flutter: ^0.10.4
  image: ^4.2.0

  # Firebase Services (Uninitialized)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  cloud_functions: ^5.0.1
  firebase_messaging: ^15.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/model/
    - assets/data/

  # Bundled fonts configuration.
